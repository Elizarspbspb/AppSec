<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Переписка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Чат</h2>
  <div id="chat-box">

  </form>
</body>
</html>
