<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Восстановление пароля — Банковский чат</title>
  <link rel="stylesheet" href="../static/style.css">
</head>
<body>
  <div class="container">
    <h2>Восстановление пароля</h2>

    <!-- Блок для flash-сообщений -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-messages">
          {% for category, message in messages %}
            <div class="flash-message
              {% if category == 'error' %}flash-error
              {% elif category == 'success' %}flash-success
              {% else %}flash-info
              {% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form action="/forgot-password" method="post" class="auth-form">
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="example@mail.com" required>
        <small class="hint">Введите email, привязанный к аккаунту</small>
      </div>

      <button type="submit" class="submit-btn">Отправить запрос</button>
    </form>

    <div class="login-link">
      <a href="/login">Вернуться к входу</a>
    </div>
  </div>
</body>
</html>
