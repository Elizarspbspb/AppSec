# semgrep scan  --config=../my.yaml ./sql_app.py
rules:
  - id: unsafe_concatinathion_plus
    languages: [python]
    severity: WARNING
    message: "The SQL string is collected via +"
    pattern: |
      def $FUNC(...):
        ...
        $Q = "$SELECT" + $ID + ...
        ...
        cur.execute($Q)
        
  - id: unsafe_concatinathion
    languages: [python]
    severity: WARNING
    message: "The SQL string is collected via +"
    pattern: |
      def $FUNC(...):
        ...
        $Q = "$SELECT" + $ID
        ...
        cur.execute($Q)
        
  - id: unsafe_concatinathion_f_strings
    languages: [python]
    severity: WARNING
    message: "The SQL string is collected via +"
    pattern: |
      def $FUNC(...):
        ...
        $Q = f"...{$X}..."
        ...
        cur.execute($Q)
        
  - id: unsafe_execute_one_param
    languages: [python]
    severity: WARNING
    message: "cur.execute($Q)"
    patterns:
    - pattern: cur.execute($Q)
    - pattern-not: cur.execute($Q, $Q2)