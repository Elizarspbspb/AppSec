      #- pattern-regex: '<s*[^>]*\shref=["''][^"'']*\{[^}]+\}[^"'']*["''][^>]*>'
      #- pattern-regex: /^"."$/gm
      #- pattern-regex: rf"""(?s)f["']{3}.*?<[^>]+>.*?\{.+?\}.*?["']{3}"""
      #- pattern-regex: <[^>]+>      # много шума
      #- pattern-regex: ".*<[a-zA-Z]+.*"
      #- pattern-regex: ".*{.*}.*"   # подходит
      - pattern-regex: "<[a-zA-Z]+.*>.*{.*}.*"   # подходит
      #- pattern-either:
      #  - pattern-regex: ".*<[a-zA-Z]+.*"
      #  - pattern-regex: ".*{.*}.*"
      #- pattern: "...<$A>..."
    fix: $X = "...{{ $VAR }}..."