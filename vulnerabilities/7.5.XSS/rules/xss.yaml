  - id: flask-html-fstring-injection
    languages: [python]
    severity: ERROR
    message: "КРИТИЧЕСКАЯ УЯЗВИМОСТЬ: Не используйте f-строки для генерации HTML-кода. Это полностью отключает встроенную защиту Jinja от XSS."
    patterns:
      - pattern-either:
          # Ловим f-строку прямо внутри функции рендеринга
          - pattern: render_template_string(f"...", ...)
          # Ловим f-строку, которая сначала записывается в переменную, а потом рендерится
          - patterns:
              - pattern-inside: |
                  $HTML = f"..."
                  ...
                  render_template_string($HTML, ...)
      # Ограничиваем поиск только строками, похожими на HTML (чтобы не ругаться на логи)
      - pattern-either:
          - pattern-regex: ".*<[a-zA-Z]+.*"
          - pattern-regex: ".*{.*}.*"
